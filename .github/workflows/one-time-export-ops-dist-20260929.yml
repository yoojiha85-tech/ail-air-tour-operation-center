name: One-time export ops dist 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-export-ops-dist-20260929.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for /ops/
        run: npx vite build --base=/ops/
      - name: Package dist
        run: |
          mkdir -p .build
          cd dist
          zip -r ../.build/ops-dist.zip .
      - name: Commit temporary build artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build/ops-dist.zip
          git commit -m "Export operations center /ops/ bundle"
          git push origin HEAD:main

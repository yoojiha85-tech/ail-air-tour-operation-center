name: One-time Vercel production deploy 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-vercel-production-deploy-20260929.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN secret is not configured in this repository.' >&2
            exit 2
          fi

      - name: Build application
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy production to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "VERCEL_DEPLOYMENT_URL=$DEPLOY_URL"

      - name: Verify production deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          python - <<'PY'
          import os, urllib.request
          u=os.environ['DEPLOY_URL'].strip()
          if not u.startswith('http'):
              raise SystemExit(f'Invalid deployment URL: {u!r}')
          with urllib.request.urlopen(u, timeout=30) as r:
              body=r.read(200000).decode('utf-8','ignore')
              print('HTTP', r.status, u)
              if r.status != 200:
                  raise SystemExit('Production URL did not return 200')
              if '<div id="root"></div>' not in body and '<div id="root">' not in body:
                  print('Warning: root marker not found, but deployment returned 200')
          PY

      - name: Remove one-time workflow
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-vercel-production-deploy-20260929.yml
          printf '\nVercel production deployment: %s\n' "$DEPLOY_URL" >> README.md
          git add README.md
          git commit -m "Deploy operations center to Vercel production"
          git push origin HEAD:main

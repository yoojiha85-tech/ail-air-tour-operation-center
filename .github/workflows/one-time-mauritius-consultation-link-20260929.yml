name: One-time Mauritius consultation link patch 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-mauritius-consultation-link-20260929.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ConsultationWorkspace
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/modules/Consultation/ConsultationWorkspace.jsx')
          s = p.read_text(encoding='utf-8')

          old = "const CANCUN_QUOTE_URL = 'https://ail-travel-main.netlify.app/admin/cancun-quote/'\nconst isCancun = value => /칸쿤|cancun/i.test(String(value || ''))"
          new = "const CANCUN_QUOTE_URL = 'https://ail-travel-main.netlify.app/admin/cancun-quote/'\nconst MAURITIUS_QUOTE_URL = 'https://ail-travel-main.netlify.app/admin/mauritius-quote/'\nconst isCancun = value => /칸쿤|cancun/i.test(String(value || ''))\nconst isMauritius = value => /모리셔스|mauritius/i.test(String(value || ''))"
          assert old in s, 'constant anchor not found'
          s = s.replace(old, new, 1)

          old = """  function openCancunQuote() {\n    if (!selected?.request_code) return\n    const url = new URL(CANCUN_QUOTE_URL)\n    url.searchParams.set('consultation', selected.request_code)\n    window.open(url.toString(), '_blank', 'noopener,noreferrer')\n  }\n"""
          new = old + """\n  function openMauritiusQuote() {\n    if (!selected?.request_code) return\n    const url = new URL(MAURITIUS_QUOTE_URL)\n    url.searchParams.set('consultation', selected.request_code)\n    window.open(url.toString(), '_blank', 'noopener,noreferrer')\n  }\n"""
          assert old in s, 'openCancunQuote anchor not found'
          s = s.replace(old, new, 1)

          anchor = """          {isCancun(selected.destination) && (\n            <div className=\"erpConsultQuotePanel\">\n"""
          panel = """          {isMauritius(selected.destination) && (\n            <div className=\"erpConsultQuotePanel\">\n              <div className=\"erpConsultQuoteHead\">\n                <div>\n                  <small>MAURITIUS QUOTE LINK</small>\n                  <b>모리셔스 견적 · 운영센터 상담번호 연결</b>\n                  <span>{selected.request_code} 한 건에 모리셔스 견적 1~5안과 수정 버전을 동일 상담 건으로 관리합니다.</span>\n                </div>\n                <div>\n                  {(canEdit || canCreate) && (\n                    <button type=\"button\" className=\"primary mini\" onClick={openMauritiusQuote}>\n                      모리셔스 견적 1~5안 관리\n                    </button>\n                  )}\n                </div>\n              </div>\n              <div className=\"erpConsultQuoteEmpty\">\n                운영센터 상담번호를 그대로 전달합니다. 기존 견적이 없어도 같은 상담번호로 첫 견적을 생성할 수 있습니다.\n              </div>\n            </div>\n          )}\n\n"""
          assert anchor in s, 'Cancun panel anchor not found'
          s = s.replace(anchor, panel + anchor, 1)

          old = """            {isCancun(selected.destination) && (canEdit || canCreate) && (\n              <button type=\"button\" className=\"primary mini\" onClick={openCancunQuote}>\n                칸쿤 견적 열기\n              </button>\n            )}\n"""
          new = """            {isMauritius(selected.destination) && (canEdit || canCreate) && (\n              <button type=\"button\" className=\"primary mini\" onClick={openMauritiusQuote}>\n                모리셔스 견적 열기\n              </button>\n            )}\n""" + old
          assert old in s, 'bottom Cancun button anchor not found'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          grep -q "MAURITIUS_QUOTE_URL" src/modules/Consultation/ConsultationWorkspace.jsx
          grep -q "모리셔스 견적 1~5안 관리" src/modules/Consultation/ConsultationWorkspace.jsx
          grep -q "openMauritiusQuote" src/modules/Consultation/ConsultationWorkspace.jsx
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Consultation/ConsultationWorkspace.jsx
          if git diff --cached --quiet; then
            echo "No source change needed"
            exit 0
          fi
          git commit -m "Link Mauritius quotes to operations consultations"
          git push origin HEAD:main

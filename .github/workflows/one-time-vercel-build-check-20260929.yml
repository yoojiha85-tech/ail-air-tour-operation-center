name: One-time Vercel build check 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-vercel-build-check-20260929.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Verify Vite output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '<div id="root"></div>' dist/index.html
          echo 'Vercel production build output verified.'

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-vercel-build-check-20260929.yml
          git commit -m "Verify operations center Vercel production build"
          git push origin HEAD:main

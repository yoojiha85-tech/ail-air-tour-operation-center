name: One-time build ops subpath 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-build-ops-subpath-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build for /ops/
        run: npx vite build --base=/ops/
      - name: Verify output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q '/ops/assets/' dist/index.html
      - name: Package artifact
        run: |
          cd dist
          zip -r ../ops-dist.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ops-dist
          path: ops-dist.zip
          if-no-files-found: error
          retention-days: 1

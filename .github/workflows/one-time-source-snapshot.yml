name: One-time source snapshot

on:
  push:
    paths:
      - '.github/workflows/one-time-source-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target source commit
        uses: actions/checkout@v4
        with:
          ref: e5eea56162178ef088bfd434ce03616ed9df846c
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ail-air-tour-operation-center-e5eea561
          path: .
          include-hidden-files: true
          if-no-files-found: error

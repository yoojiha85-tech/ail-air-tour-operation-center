name: One-time finalize Vercel ops v2 20260929

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-finalize-vercel-ops-v2-20260929.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update quote fallback origin
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/modules/Consultation/ConsultationWorkspace.jsx')
          s=p.read_text(encoding='utf-8')
          old='https://ail-travel-main.netlify.app'
          new='https://ail-travel-main.vercel.app'
          if old not in s:
              print('Fallback already updated.')
          else:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build /ops/ bundle
        run: npx vite build --base=/ops/
      - name: Package bundle
        run: |
          rm -rf .build
          mkdir -p .build
          cd dist
          zip -r ../.build/ops-dist.zip .
      - name: Commit source and bundle only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/Consultation/ConsultationWorkspace.jsx
          git add -f .build/ops-dist.zip
          if git diff --cached --quiet; then
            echo 'No source or bundle changes to commit.'
            exit 0
          fi
          git commit -m "Use Vercel as operations quote fallback origin"
          git push origin HEAD:main
